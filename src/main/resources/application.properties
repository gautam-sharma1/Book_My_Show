spring.application.name=BookMyShow
spring.datasource.url=jdbc:mysql://localhost:3306/BMS?createDatabaseIfNotExist=true
#?createDatabaseIfNotExist=true by writing this after db name the database is created automaticallyin mysql no need t create even db in my sql
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Password3}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
#jdbc:mysql://localhost:3306/BMS?createDatabaseIfNotExist=true

# ============================================================
# SPRING SECURITY / JWT SETTINGS
# ============================================================

# The secret used to SIGN and VERIFY every token.
# HS256 needs at least 256 bits = 32 characters. If this is shorter, JJWT throws
# at startup - which is good, it fails loudly instead of being insecure quietly.
# ${JWT_SECRET:default} = use the JWT_SECRET environment variable if it exists,
# otherwise fall back to the value after the colon. Same pattern as DB_PASSWORD.
# In a real deployment the env var is set and this default is never used, because
# anyone who knows the secret can forge a token for ANY user, including an admin.
app.jwt.secret=${JWT_SECRET:ThisIsMyBookMyShowSecretKeyForJwtSigning2026MustBeAtLeast32Chars}

# How long a token stays valid, in milliseconds. 86400000 ms = 24 hours.
# In production you would use ~15 minutes plus a refresh token, so a stolen token
# is useless quickly. 24h is the right trade-off for a learning project.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# FIRST ADMIN (created automatically at startup by AdminSeeder)
# ============================================================
# Needed because admin endpoints require an admin, but a fresh database has none
# and /api/auth/register can only ever create a USER. Someone has to be first.
# Only used on the FIRST run against an empty database - after the admin row exists
# the seeder skips, so changing the password here later does NOT change the login.
app.admin.email=${ADMIN_EMAIL:admin@bms.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Admin}
